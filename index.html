<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta property="og:url" content="https://rayul.ca/">

<meta property="og:image:width" content="1200">

<link rel="icon" type="image/png" href="assets/images/favicon - white.png">
<link rel="apple-touch-icon" href="assets/images/favicon - white.png">
<link rel="preconnect" href="https://player.vimeo.com">
<link rel="preconnect" href="https://i.vimeocdn.com">
<link rel="preconnect" href="https://f.vimeocdn.com">
<link rel="preload" as="image" href="assets/images/thumbs/vimeo-vitaly-oblivion-s25.jpg">
<link rel="stylesheet" href="assets/site.css">
<style>
html, body { height: 100%; overflow: hidden; }
.slides {
  height: 100vh; height: 100svh;
  overflow-y: auto; overflow-x: hidden;
  scroll-snap-type: y mandatory;
  overscroll-behavior: contain;
  scrollbar-width: none;
}
.slides::-webkit-scrollbar { display: none; }
.slide {
  position: relative; height: 100vh; height: 100svh; overflow: hidden;
  scroll-snap-align: start; scroll-snap-stop: always;
  background: #000;
}
.media { position: absolute; inset: 0; cursor: pointer; }
.media .poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.media .vid { position: absolute; inset: 0; overflow: hidden; }
.media iframe, .media .yt-bg {
  position: absolute; top: 50%; left: 50%;
  width: max(100vw, 177.78vh); height: max(56.25vw, 100vh);
  width: max(100vw, 177.78svh); height: max(56.25vw, 100svh);
  transform: translate(-50%, -50%);
  border: 0; pointer-events: none;
  opacity: 0; transition: opacity 0.9s ease;
}
.media .vid.on iframe, .media .vid.on .yt-bg { opacity: 1; }
.shade-b { position: absolute; left: 0; right: 0; bottom: 0; height: 55%; background: linear-gradient(to top, rgba(0,0,0,0.6), rgba(0,0,0,0)); pointer-events: none; }
.shade-t { position: absolute; left: 0; right: 0; top: 0; height: 120px; background: linear-gradient(to bottom, rgba(0,0,0,0.35), rgba(0,0,0,0)); pointer-events: none; }

.slide-foot {
  position: absolute; left: var(--pad); right: var(--pad); bottom: 40px;
  display: flex; justify-content: space-between; align-items: flex-end; gap: 32px;
  pointer-events: none;
}
.slide-foot > * { pointer-events: auto; }
.slate { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.slate h1, .slate h2 {
  margin: 0 0 0 -0.06em; font-size: 128px; font-weight: 500; line-height: 0.88; letter-spacing: -0.03em;
  display: flex; flex-direction: column;
}
.slate h2 button { text-align: left; font-weight: inherit; line-height: inherit; letter-spacing: inherit; display: flex; flex-direction: column; }
.slate-sub { display: flex; flex-direction: column; gap: 4px; }
.playlink { align-self: flex-start; display: flex; gap: 8px; align-items: center; padding: 8px 0; margin-top: 4px; color: var(--ink); }
.playlink:hover { color: #fff; }
.side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex: none; }
.side a, .side button { display: flex; gap: 12px; align-items: baseline; }
.side .nextlink { padding: 12px 0; color: var(--quiet); }
.side .nextlink .ttl { color: var(--ink); }
.side .nextlink svg { align-self: center; }

/* sound toggle */
.snd { display: flex; align-items: center; gap: 10px; padding: 8px 0; color: var(--ink); }
.snd:hover { color: #fff; }
.eq { display: flex; align-items: flex-end; gap: 2px; height: 10px; }
.eq i { display: block; width: 2px; height: 2px; background: currentColor; }
.eq.on i { animation: eq 0.8s ease-in-out infinite alternate; }
.eq.on i:nth-child(2) { animation-delay: -0.35s; }
.eq.on i:nth-child(3) { animation-delay: -0.6s; }
.eq.on i:nth-child(4) { animation-delay: -0.15s; }
@keyframes eq { from { height: 2px; } to { height: 10px; } }
@media (prefers-reduced-motion: reduce) { .eq.on i { animation: none; height: 7px; } }

.slide-reel .mq { width: 480px; margin-top: 12px; --mq-h: 20px; --mq-gap: 28px; --mq-dur: 52s; }

/* jump list */
.jump { position: fixed; inset: 0; z-index: 30; background: var(--ground); display: none; overflow-y: auto; }
.jump.is-open { display: block; }
.jump-head { display: flex; justify-content: space-between; align-items: center; padding: 20px var(--pad) 0; font-size: var(--small); letter-spacing: 0.04em; }
.jump-head a, .jump-head button { padding: 12px 0; }
.jump-head button { color: var(--quiet); }
.jump ol { list-style: none; margin: 56px var(--pad) 48px; padding: 0; }
.jump li button {
  width: 100%; display: grid; grid-template-columns: 64px minmax(0, 1fr) 280px 240px; align-items: baseline; gap: 0 16px;
  padding: 10px 0; border-bottom: 1px solid var(--line); text-align: left; color: var(--quiet);
}
.jump li .n { font-size: 13px; }
.jump li .t { font-size: 28px; font-weight: 500; letter-spacing: -0.01em; color: var(--ink-2); }
.jump li .r, .jump li .m { font-size: 13px; letter-spacing: 0.04em; }
.jump li .m { text-align: right; }
.jump li button:hover .t, .jump li button[aria-current="true"] .t { color: #fff; }
.jump li button[aria-current="true"] { color: #fff; }

@media (max-width: 700px) {
  .slide-foot { bottom: 24px; flex-direction: column; align-items: stretch; gap: 20px; }
  .slate { gap: 20px; }
  .slate h1 { font-size: 72px; margin-left: -0.07em; }
  .slate h2 { font-size: 44px; line-height: 0.92; letter-spacing: -0.02em; margin-left: -0.05em; }
  .side { flex-direction: row; justify-content: space-between; align-items: center; border-top: 1px solid #2a2b2e; gap: 12px; }
  .side a, .side button { padding: 14px 0; gap: 10px; align-items: center; }
  .side .nextlink { padding: 14px 0; }
  .snd { padding: 14px 0; }
  .slide-reel .side .count { order: -1; }
  .slide-reel .mq { width: auto; margin-top: 10px; --mq-h: 16px; --mq-gap: 22px; --mq-dur: 44s; }
  .jump-head { padding-top: 8px; }
  .jump-head a, .jump-head button { padding: 14px 0; }
  .jump ol { margin: 16px var(--pad) 40px; }
  .jump li button { grid-template-columns: 32px minmax(0, 1fr); row-gap: 4px; }
  .jump li .n { font-size: 12px; padding-top: 3px; }
  .jump li .t { font-size: 18px; }
  .jump li .r { grid-column: 2; font-size: 11px; }
  .jump li .m { display: none; }
}
</style>
<script src="assets/data/projects.js" defer></script>
<script src="assets/site.js" defer></script>
<script src="assets/work.js" defer></script>
</head>
<body>

<header class="site-header overlay">
  <a href="/" class="brand">rayul</a>
  <nav aria-label="Main">
    <a href="/" aria-current="page">WORK</a>
    <a href="/archive">INDEX</a>
    <a href="/about">ABOUT</a>
  </nav>
</header>

<main class="slides" id="slides" tabindex="-1">
  <!-- Slides are built from assets/data/projects.js by assets/work.js -->
  <section class="slide slide-reel" data-i="0" aria-label="Showreel">
    <div class="media" aria-hidden="true"><div class="vid"></div></div>
    <div class="shade-t"></div><div class="shade-b"></div>
    <div class="slide-foot">
      <div class="slate">
        <h1>RAYUL</h1>
        <div class="slate-sub small">
          <span>DIRECTOR / EDITOR, <span class="quiet">TORONTO</span></span>
          <div class="mq" id="reel-logos"></div>
        </div>
      </div>
      <div class="side small">
        <button type="button" class="snd" id="snd" aria-pressed="false">
          <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span class="snd-label">SOUND OFF</span>
        </button>
        <span class="count"></span>
        <a href="#" class="nextlink"></a>
      </div>
    </div>
  </section>
</main>

<div class="jump" id="jump" role="dialog" aria-modal="true" aria-label="All projects">
  <div class="jump-head">
    <a href="/" class="brand" style="font-weight:500">rayul</a>
    <button type="button" id="jump-close">CLOSE</button>
  </div>
  <ol id="jump-list"></ol>
</div>

</body>
</html>
